# Self-hosted stack for the Next.js boilerplate.
#
# Usage:
#   cp .env.podman.example .env.podman   # then edit it
#   bun run podman:build
#   bun run podman:up
#
# The database is Turso/libSQL. Point DATABASE_URL at a Turso database
# (`libsql://<db>.turso.io`) or mount a local SQLite file on a volume.

services:
  app:
    build:
      context: ..
      dockerfile: podman/Containerfile
    image: nextjs-boilerplate:latest
    ports:
      - "3000:3000"
    env_file:
      - ../.env.podman
    environment:
      - HOSTNAME=0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
